<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ob-havo Dasturi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="weather-card">
      <header class="header">
        <div class="title-wrap">
          <p class="mini-label">Ob-havo</p>
          <h1>O‘zbekiston</h1>
        </div>
        <button class="refresh-btn" id="refreshBtn" aria-label="Yangilash">
          <span>↻</span>
        </button>
      </header>

      <div class="search-box">
        <input
          id="cityInput"
          type="text"
          autocomplete="off"
          placeholder="Shahar nomini kiriting"
        />
        <button id="searchBtn" aria-label="Qidirish">Qidirish</button>
      </div>

      <div id="suggestions" class="suggestions"></div>

      <div id="errorBox" class="error-box hidden">
        <span>⚠</span>
        <p id="errorMsg">Noto‘g‘ri shahar nomi!</p>
      </div>

      <main id="weatherBox" class="weather-box hidden">
        <div class="top-row">
          <div class="icon-wrap">
            <div id="weatherIcon" class="weather-icon">☀️</div>
          </div>
          <div class="temp-block">
            <div id="temp" class="temp">22°C</div>
            <div id="description" class="description">Clear</div>
          </div>
        </div>

        <div class="city-line">
          <span id="city">Toshkent</span>
          <span id="country" class="country">UZ</span>
        </div>

        <div class="info-grid">
          <div class="info-item">
            <div class="label">Namlik</div>
            <div class="value" id="humidity">50%</div>
          </div>
          <div class="info-item">
            <div class="label">Shamol</div>
            <div class="value" id="wind">12 km/h</div>
          </div>
          <div class="info-item">
            <div class="label">His etilgan</div>
            <div class="value" id="feelsLike">24°C</div>
          </div>
          <div class="info-item">
            <div class="label">Bosim</div>
            <div class="value" id="pressure">1012 hPa</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
